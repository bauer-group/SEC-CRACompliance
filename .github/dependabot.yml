# =============================================================================
# Dependabot – Automated Dependency Updates
# =============================================================================
# Keeps GitHub Actions and npm dependencies up to date.
# Schedule: weekly on Sunday at 18:20 UTC - the auto-merge step of this
# repository (automation-templates docs/workflows/docker-maintenance.md).
#
# CRA Reference: Art. 10 Abs. 6 (timely security updates)
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:20"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # npm (VitePress + dev tooling)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "18:20"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    # Minor and patch updates arrive as one PR per run, which
    # dependabot-maintenance.yml merges once nodejs-pr.yml has passed.
    # Dependabot assigns an update to the first group it matches.
    # - 0.x packages stay out of it: below 1.0.0 a minor update counts as
    #   major, and one such update would hold the whole group open. They get
    #   a PR of their own, left open for review. Remove a package from
    #   exclude-patterns once it reaches 1.0.0.
    # - Major updates keep the existing groups, so VitePress and the dev
    #   tooling each arrive as one PR for review.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "markdownlint-cli2"     # 0.x
          - "vitepress-plugin-rss"  # 0.x
        update-types:
          - "minor"
          - "patch"
      vitepress:
        patterns:
          - "vitepress"
        update-types:
          - "major"
      dev-tooling:
        patterns:
          - "markdownlint-cli2"
          - "linkinator"
          - "rimraf"
        update-types:
          - "major"
